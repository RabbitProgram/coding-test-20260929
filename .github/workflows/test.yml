name: Test

# PR の作成時と、PR への push（差分の変更）時に実行する
on:
  pull_request:
    types: [opened, synchronize, reopened]

# 同じ PR で新しい実行が始まったら、古い実行はキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

# backend と frontend は、互いに依存しないので並列に実行される
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: E2E tests
        run: npm run test:e2e
      - name: Build
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: 1
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: API 型が backend/openapi.json と一致しているか
        run: |
          npm run api:types
          git diff --exit-code -- lib/api/schema.d.ts \
            || { echo "::error::schema.d.ts が古い。frontend で npm run api:types を実行してコミットすること"; exit 1; }
      # 型チェックも兼ねる
      - name: Build
        run: npm run build
